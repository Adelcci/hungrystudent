<style>
  :root{
    --accent:#C2410C; --accent-dark:#9A3412; --tint:#FFF1E6;
    --ink:#1C1917; --muted:#57534E; --line:#E7E5E4; --bg:#F4F4F2; --white:#FFFFFF;
    --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
  body{margin:0;font-family:'DM Sans','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
  img,svg{max-width:100%}
  a{color:var(--accent)} a:hover{color:var(--accent-dark)}
  a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .wrap{max-width:1200px;margin:0 auto;padding-inline:24px}
  h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.03em;margin:0}
  h2{font-size:clamp(2rem,3.6vw,3rem);line-height:1.1}
  p{margin:0}

  .btn{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:16px 30px;border-radius:18px;
       background:var(--accent);color:#fff;font-weight:700;font-size:17px;text-decoration:none;
       box-shadow:0 10px 24px rgba(194,65,12,.25)}
  .btn:hover{background:var(--accent-dark);color:#fff}

  /* header */
  .site-header{background:#fff;border-bottom:1px solid var(--line)}
  .nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-block:18px}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:22px}
  .logo-mark{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center}
  .nav-links{display:flex;flex-wrap:wrap;align-items:center;gap:24px;font-weight:500;font-size:15px}
  .nav-links a{color:#44403C;text-decoration:none}
  .nav-links a.pill{background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-weight:700;min-height:44px;display:inline-flex;align-items:center}

  /* hero */
  .hero{background:#fff}
  .hero .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:56px;padding-block:72px 96px}
  .hero-text{flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:28px}
  .badge{align-self:flex-start;background:var(--tint);color:var(--accent-dark);font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px}
  .hero h1{font-size:clamp(2.6rem,5.2vw,4.4rem);line-height:1.02;letter-spacing:-.035em}
  .hero h1 span{color:var(--accent)}
  .lead{font-size:1.2rem;color:var(--muted);max-width:34rem}
  .hero-ctas{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
  .link-plain{color:var(--ink);font-weight:700;text-decoration:none;padding:12px 8px}
  .small{font-size:14px;color:var(--muted)}
  .small a{font-weight:700;text-decoration:underline}

  .hero-visual{flex:1 1 380px;min-width:0;display:flex;justify-content:center;position:relative;padding:24px 0}
  .blob{position:absolute;width:420px;max-width:100%;aspect-ratio:1;border-radius:50%;background:var(--tint);top:50%;left:50%;transform:translate(-50%,-50%)}
  .phone{position:relative;width:300px;max-width:100%;background:var(--ink);border-radius:44px;padding:12px;box-shadow:0 30px 60px rgba(28,25,23,.22)}
  .screen{background:var(--bg);border-radius:34px;padding:28px 18px 20px;display:flex;flex-direction:column;gap:14px}
  .budget{background:var(--accent);color:#fff;border-radius:22px;padding:16px}
  .budget .amount{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
  .bar{margin-top:10px;height:8px;border-radius:99px;background:rgba(255,255,255,.3)}
  .bar i{display:block;width:62%;height:8px;border-radius:99px;background:#fff}
  .meal{background:#fff;border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center}
  .meal-ico{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center}
  .meal b{display:block;font-size:14px} .meal small{font-size:12px;color:var(--muted)}

  /* sections */
  section.block{padding-block:104px}
  .white{background:#fff}
  .section-head{display:flex;flex-direction:column;gap:12px;margin-bottom:48px;max-width:640px}
  .section-head.center{text-align:center;align-items:center;margin-inline:auto}
  .kicker{font-weight:700;color:var(--accent);font-size:15px}

  .duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
  .card-problem,.card-solution
