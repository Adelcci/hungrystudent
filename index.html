<style>
  :root{
    --accent:#C2410C; --accent-dark:#9A3412; --tint:#FFF1E6;
    --ink:#1C1917; --muted:#57534E; --line:#E7E5E4; --bg:#F4F4F2; --white:#FFFFFF;
    --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:'DM Sans','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
  img,svg{max-width:100%}
  a{color:var(--accent);text-decoration:none} a:hover{color:var(--accent-dark)}
  a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .wrap{max-width:1200px;margin:0 auto;padding-inline:24px}
  h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.03em;margin:0}
  h2{font-size:clamp(2rem,3.6vw,3rem);line-height:1.1}
  p{margin:0}

  .btn{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:16px 30px;border-radius:18px;
       background:var(--accent);color:#fff;font-weight:700;font-size:17px;text-decoration:none;
       box-shadow:0 10px 24px rgba(194,65,12,.25);cursor:pointer;border:none}
  .btn:hover{background:var(--accent-dark);color:#fff}

  /* header */
  .site-header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
  .nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-block:18px}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:22px;cursor:pointer}
  .logo-mark{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center}
  .nav-links{display:flex;flex-wrap:wrap;align-items:center;gap:24px;font-weight:500;font-size:15px}
  .nav-links a{color:#44403C;cursor:pointer}
  .nav-links a.pill{background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-weight:700;min-height:44px;display:inline-flex;align-items:center}

  /* views */
  .view{display:none}
  .view.active{display:block}

  /* hero */
  .hero{background:#fff}
  .hero .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:56px;padding-block:72px 96px}
  .hero-text{flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:28px}
  .badge{align-self:flex-start;background:var(--tint);color:var(--accent-dark);font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px}
  .hero h1{font-size:clamp(2.6rem,5.2vw,4.4rem);line-height:1.02;letter-spacing:-.035em}
  .hero h1 span{color:var(--accent)}
  .lead{font-size:1.2rem;color:var(--muted);max-width:34rem}
  .hero-ctas{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
  .link-plain{color:var(--ink);font-weight:700;cursor:pointer;padding:12px 8px}
  .small{font-size:14px;color:var(--muted)}

  .hero-visual{flex:1 1 380px;min-width:0;display:flex;justify-content:center;position:relative;padding:24px 0}
  .blob{position:absolute;width:420px;max-width:100%;aspect-ratio:1;border-radius:50%;background:var(--tint);top:50%;left:50%;transform:translate(-50%,-50%)}
  .phone{position:relative;width:300px;max-width:100%;background:var(--ink);border-radius:44px;padding:12px;box-shadow:0 30px 60px rgba(28,25,23,.22)}
  .screen{background:var(--bg);border-radius:34px;padding:28px 18px 20px;display:flex;flex-direction:column;gap:14px}
  .budget{background:var(--accent);color:#fff;border-radius:22px;padding:16px}
  .budget .amount{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
  .bar{margin-top:10px;height:8px;border-radius:99px;background:rgba(255,255,255,.3)}
  .bar i{display:block;width:62%;height:8px;border-radius:99px;background:#fff}
  .meal{background:#fff;border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center}
  .meal-ico{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center}
  .meal b{display:block;font-size:14px} .meal small{font-size:12px;color:var(--muted)}

  /* sections */
  section.block{padding-block:104px}
  .white{background:#fff}
  .section-head{display:flex;flex-direction:column;gap:12px;margin-bottom:48px;max-width:640px}
  .section-head.center{text-align:center;align-items:center;margin-inline:auto}
  .kicker{font-weight:700;color:var(--accent);font-size:15px}

  .features{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
  .feature{background:var(--bg);border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:16px;cursor:pointer;transition:transform .2s, border-color .2s;border:2px solid transparent}
  .feature:hover{transform:translateY(-4px);border-color:var(--accent)}
  .feature .ico{width:56px;height:56px;border-radius:18px;background:var(--tint);display:grid;place-items:center}
  .feature h3{font-size:1.5rem;letter-spacing:-.02em}
  .feature p{color:var(--muted);font-size:1.05rem}

  .banner{background:var(--ink);color:#fff;border-radius:40px;padding:clamp(36px,6vw,80px);display:flex;flex-wrap:wrap;gap:48px;align-items:center}
  .banner-text{flex:1 1 460px;min-width:0;display:flex;flex-direction:column;gap:20px}
  .banner h2{font-size:clamp(2.2rem,4.4vw,3.6rem);line-height:1.05}
  .banner h2 span{color:#FB923C}
  .banner p{font-size:1.15rem;color:#D6D3D1;max-width:36rem}
  .checklist{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
  .checklist li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-radius:20px;background:rgba(255,255,255,.06);color:#A8A29E;font-weight:500}
  .checklist li s{text-decoration-thickness:2px}
  .checklist li.yes{background:var(--accent);color:#fff;font-weight:700;font-size:1.15rem;padding-block:22px}

  .posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
  .post{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--ink);cursor:pointer}
  .post:hover{border-color:var(--accent)}
  .post h3{font-size:1.35rem;letter-spacing:-.02em}
  .post p{color:var(--muted)}
  .post span{margin-top:auto;font-weight:700;color:var(--accent)}

  .subpage{background:#fff;padding-block:60px 100px}
  .subpage-content{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
  .subpage-content h2{font-size:clamp(2rem,3vw,2.6rem)}
  .subpage-content p{font-size:1.12rem;color:var(--muted);line-height:1.7}
  .back-link{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--accent);cursor:pointer;margin-bottom:20px}

  .newsletter-box{background:var(--tint);border-radius:28px;padding:48px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:32px;margin-top:64px}
  .newsletter-form{display:flex;gap:12px;flex-wrap:wrap;flex:1 1 340px}
  .newsletter-form input{flex:1;min-height:56px;padding:0 20px;border-radius:16px;border:1px solid var(--line);font-size:16px;background:#fff}

  .modal-overlay{position:fixed;inset:0;background:rgba(28,25,23,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
  .modal-overlay.open{display:flex}
  .modal{background:#fff;border-radius:32px;padding:40px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:20px;position:relative;box-shadow:0 25px 50px rgba(0,0,0,.25)}
  .modal-close{position:absolute;top:20px;right:20px;background:var(--bg);border:none;width:40px;height:40px;border-radius:50%;font-weight:bold;cursor:pointer;font-size:18px}

  footer{background:#fff;border-top:1px solid var(--line)}
  .footer-cta{display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center;padding-block:96px 40px}
  .footer-bottom{border-top:1px solid var(--line);padding-block:28px 40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
  .footer-bottom strong{font-family:var(--display);font-size:18px;display:block}
  .socials{display:flex;flex-wrap:wrap;gap:8px}
  .socials a{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;min-height:44px;border-radius:999px;background:var(--bg);color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
</style>
</head>

  <main>
    <section class="hero">
      <div class="wrap">
        <div class="hero-text">
          <span class="badge">Aplikace pro vysokoškoláky</span>
          <h1>Jíš
